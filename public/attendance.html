<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Tracker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; padding: 20px; }
    .container { max-width: 1000px; margin: 0 auto; background: white; border-radius: 8px; padding: 24px; }
    h1 { color: #333; margin-bottom: 24px; }
    h2 { color: #333; margin-top: 24px; margin-bottom: 12px; font-size: 18px; }
    .section { margin-bottom: 32px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 4px; font-weight: 500; }
    input[type="email"], input[type="text"], select { padding: 8px; border: 1px solid #ddd; border-radius: 4px; width: 100%; max-width: 300px; }
    button { padding: 8px 16px; background: #0066cc; color: white; border: none; border-radius: 4px; cursor: pointer; margin-right: 8px; }
    button:hover { background: #0052a3; }
    .checkbox { margin-top: 12px; }
    input[type="checkbox"] { margin-right: 8px; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
    th { background: #f9f9f9; font-weight: 600; }
    tr:hover { background: #f9f9f9; }
    .stat-box { display: inline-block; padding: 16px; background: #f0f7ff; border-radius: 4px; margin-right: 16px; margin-bottom: 16px; }
    .stat-value { font-size: 24px; font-weight: 600; color: #0066cc; }
    .stat-label { font-size: 12px; color: #666; }
    .error { color: #cc0000; padding: 12px; background: #ffe6e6; border-radius: 4px; margin-bottom: 16px; }
    .success { color: #28a745; padding: 12px; background: #e8f5e9; border-radius: 4px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Attendance Tracker</h1>
    <div id="message"></div>

    <!-- Mark Attendance Section -->
    <div class="section">
      <h2>Mark Attendance</h2>
      <form onsubmit="markAttendance(event)">
        <div class="form-group">
          <label>Member Email</label>
          <select id="memberEmail" required></select>
        </div>
        <div class="form-group">
          <label>Event</label>
          <select id="eventName" required></select>
        </div>
        <div class="form-group">
          <label>Date</label>
          <input type="date" id="attendanceDate" required>
        </div>
        <div class="checkbox">
          <input type="checkbox" id="attended" checked>
          <label for="attended" style="display: inline; margin: 0;">Attended</label>
        </div>
        <br><br>
        <button type="submit">Record Attendance</button>
      </form>
    </div>

    <!-- Event Stats Section -->
    <div class="section">
      <h2>Event Attendance Stats</h2>
      <div id="statsContainer"></div>
    </div>

    <!-- Attendance Records Section -->
    <div class="section">
      <h2>Attendance Records</h2>
      <div class="form-group">
        <label>Filter by Member (optional)</label>
        <input type="email" id="filterEmail" placeholder="Leave empty for all">
        <button onclick="loadRecords()">Search</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>Email</th>
            <th>Event</th>
            <th>Date</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="recordsTable"></tbody>
      </table>
    </div>
  </div>

  <script>
    const API_BASE = '/attendance';

    async function loadFormData() {
      try {
        const res = await fetch(`${API_BASE}/form`);
        if (!res.ok) throw new Error('Failed to load form data');

        const { events, members } = await res.json();

        const memberSelect = document.getElementById('memberEmail');
        memberSelect.innerHTML = '<option value="">-- Select Member --</option>';
        members.forEach(m => {
          const option = document.createElement('option');
          option.value = m.email;
          option.textContent = `${m.name} (${m.email})`;
          memberSelect.appendChild(option);
        });

        const eventSelect = document.getElementById('eventName');
        eventSelect.innerHTML = '<option value="">-- Select Event --</option>';
        events.forEach(e => {
          const option = document.createElement('option');
          option.value = e;
          option.textContent = e;
          eventSelect.appendChild(option);
        });
      } catch (err) {
        showMessage(`Error loading form: ${err.message}`, 'error');
      }
    }

    async function markAttendance(e) {
      e.preventDefault();
      try {
        const data = {
          email: document.getElementById('memberEmail').value,
          eventName: document.getElementById('eventName').value,
          date: document.getElementById('attendanceDate').value,
          attended: document.getElementById('attended').checked
        };

        const res = await fetch(`${API_BASE}/mark`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        if (!res.ok) throw new Error('Failed to record attendance');

        showMessage('Attendance recorded successfully', 'success');
        loadRecords();
        loadStats();
      } catch (err) {
        showMessage(`Error: ${err.message}`, 'error');
      }
    }

    async function loadRecords() {
      try {
        const email = document.getElementById('filterEmail').value;
        const params = new URLSearchParams();
        if (email) params.append('email', email);

        const res = await fetch(`${API_BASE}/records?${params}`);
        if (!res.ok) throw new Error('Failed to load records');

        const records = await res.json();
        const tbody = document.getElementById('recordsTable');
        tbody.innerHTML = '';

        records.forEach(r => {
          const row = document.createElement('tr');
          const emailCell = document.createElement('td');
          emailCell.textContent = r.email;
          const eventCell = document.createElement('td');
          eventCell.textContent = r.eventName;
          const dateCell = document.createElement('td');
          dateCell.textContent = r.date;
          const statusCell = document.createElement('td');
          statusCell.textContent = r.attended ? 'Present' : 'Absent';

          row.appendChild(emailCell);
          row.appendChild(eventCell);
          row.appendChild(dateCell);
          row.appendChild(statusCell);
          tbody.appendChild(row);
        });
      } catch (err) {
        showMessage(`Error: ${err.message}`, 'error');
      }
    }

    async function loadStats() {
      try {
        const res = await fetch(`${API_BASE}/form`);
        if (!res.ok) throw new Error('Failed to load events');

        const { events } = await res.json();
        const container = document.getElementById('statsContainer');
        container.innerHTML = '';

        for (const event of events) {
          const statRes = await fetch(`${API_BASE}/stats/${encodeURIComponent(event)}`);
          if (!statRes.ok) continue;

          const stats = await statRes.json();
          if (stats.total === 0) continue;

          const box = document.createElement('div');
          box.className = 'stat-box';

          const valueDiv = document.createElement('div');
          valueDiv.className = 'stat-value';
          valueDiv.textContent = `${stats.attended}/${stats.total}`;

          const labelDiv = document.createElement('div');
          labelDiv.className = 'stat-label';
          labelDiv.textContent = `${event} (${stats.percentage}%)`;

          box.appendChild(valueDiv);
          box.appendChild(labelDiv);
          container.appendChild(box);
        }
      } catch (err) {
        showMessage(`Error loading stats: ${err.message}`, 'error');
      }
    }

    function showMessage(msg, type) {
      const el = document.getElementById('message');
      el.textContent = msg;
      el.className = type;
      setTimeout(() => { el.textContent = ''; el.className = ''; }, 5000);
    }

    // Load on page load
    window.onload = () => {
      loadFormData();
      loadRecords();
      loadStats();
      // Set today's date as default
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('attendanceDate').value = today;
    };
  </script>
</body>
</html>
